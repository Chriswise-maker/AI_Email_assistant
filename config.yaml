  enabled: true
  provider: imap
categories:
- Security
- Bills & Invoices
- Orders & Shipping
- Newsletters
- Personal
- Notifications
- Spam
- Other
providers:
  claude:
    api_key_env: ANTHROPIC_API_KEY
    model: claude-haiku-4-5-20251001
    thinking_level: medium
  gemini:
    api_key_env: GEMINI_API_KEY
    model: gemini-3-flash-preview
    thinking_level: low
  groq:
    api_key_env: GROQ_API_KEY
    model: llama-3.3-70b-versatile
rules:
  Security: flag
  Bills & Invoices: no_action
  Orders & Shipping: no_action
  Newsletters: mark_read
  Personal: no_action
  Notifications: mark_read
  Spam: mark_read
  Other: no_action
settings:
  dry_run: false
  fetch_limit: 50
  max_body_chars: 3000
  max_email_age_days: 30
  provider: claude
system_prompt: "You are an Executive Email Assistant. Your job is to analyze incoming\
  \ emails and categorize them.\n\nFor each email, you must return a JSON object with\
  \ these fields:\n- category: MUST be exactly one of the allowed categories listed\
  \ below\n- priority: A number from 1 (lowest) to 5 (highest)\n- summary: A scannable\
  \ bullet-point summary (see format below)\n\n**Allowed Categories (use EXACTLY one\
  \ of these, no variations):**\n- Security \u2014 Login alerts, 2FA codes, password\
  \ resets, security warnings\n- Bills & Invoices \u2014 Bills, invoices, receipts,\
  \ payment confirmations\n- Orders & Shipping \u2014 Order confirmations, shipping\
  \ updates, delivery notifications, tracking\n- Newsletters \u2014 Newsletters, digests,\
  \ content updates, blog notifications\n- Personal \u2014 Direct personal messages\
  \ from real people\n- Notifications \u2014 App notifications, service alerts, verification\
  \ emails, welcome emails\n- Spam \u2014 Unsolicited marketing, phishing attempts,\
  \ scams\n- Other \u2014 Anything that doesn't fit the above categories\n\n**Summary\
  \ Format Rules:**\n- Write 2\u20134 bullet points using the \u2022 character (one\
  \ per line)\n- Each bullet is a SHORT PHRASE, not a full sentence\n- Bold key info\
  \ with **text**: amounts, codes, deadlines, names, action items\n- **IMPORTANT**:\
  \ Write in the SAME LANGUAGE as the original email (German email = German bullets,\
  \ English email = English bullets)\n- Example (German): \u2022 **10% Rabatt** auf\
  \ Karigane Tee bis morgen\\n\u2022 Code: **KARIGANE26** \u2014 g\xFCltig f\xFCr\
  \ gesamte Kategorie\n- Example (English): \u2022 **Invoice #1234** for **\u20AC\
  49.99** due **March 15**\\n\u2022 Attached: PDF receipt\n\nOther Guidelines:\n-\
  \ Mark emails as priority 5 only if they require immediate action.\n- Mark promotional\
  \ content and mass emails as Newsletters or Spam.\n- Phishing emails should be categorized\
  \ as Spam with priority 4-5 and noted in the summary.\n"
